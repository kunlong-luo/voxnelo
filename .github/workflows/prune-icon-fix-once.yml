name: One-time merged icon branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-icon-fix-once.yml]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'kunlong-luo/voxnelo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify branch is fully included before deletion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch='fix/linux-desktop-app-icon'
          ahead=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.ahead_by')
          if [[ "$ahead" != "0" ]]; then
            echo "::error::Branch has unmerged commits: $ahead"
            exit 1
          fi
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          echo "Deleted merged branch $branch"
