# Site owner has confirmed the web experience can be publicly accessible.
# Publish renderer-only static files; do NOT publish the private repository source.
name: GitHub Pages public web demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-preview
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build only the web renderer
        run: pnpm build:renderer
      - name: Check project-relative files and branded assets
        run: node scripts/check-pages-artifact.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        # Initialize Settings → Pages → Build and deployment → GitHub Actions once as a repository admin.
        # Do not attempt to create the site with the workflow GITHUB_TOKEN.
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish web preview only
        id: deployment
        uses: actions/deploy-pages@v4
