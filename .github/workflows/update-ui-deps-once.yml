# Temporary lockfile updater. Removed as soon as it has run.
name: UI design system lockfile refresh
on:
  push:
    branches: [refactor/shadcn-tailwind-design-system]
    paths: [.github/workflows/update-ui-deps-once.yml]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.11.2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve locked stable dependencies
        run: |
          pnpm install --lockfile-only --no-frozen-lockfile
          node scripts/check-stable-dependencies.mjs
      - name: Commit generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo 'pnpm-lock.yaml already up-to-date'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          git commit -m 'chore(ui): update pnpm lockfile for Base UI and Motion'
          git push origin "HEAD:refactor/shadcn-tailwind-design-system"
