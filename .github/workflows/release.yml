name: Desktop release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  desktop-release-candidate:
    name: Validate desktop bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            builder_args: --linux deb AppImage
          - os: windows-latest
            target: windows
            builder_args: --win nsis
          - os: macos-latest
            target: mac
            builder_args: --mac dmg
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Require true offline ASR recognition for models included in candidate
        run: pnpm asr:verify-real
      - name: Package unsigned bundle
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
      - name: Add Linux AppStream branding and icon
        if: runner.os == 'Linux'
        run: node --experimental-strip-types scripts/brand-linux-installer.mts
      - name: Verify unpacked bundle AND OS-native candidate installers
        env:
          VOXNELO_REQUIRE_INSTALLERS: '1'
        run: node --experimental-strip-types scripts/check-desktop-package.mts
      - name: Generate candidate installer checksum manifest
        run: node --experimental-strip-types scripts/write-candidate-manifest.mts
      - name: Install Linux candidate via apt on runner
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find release -maxdepth 1 -name 'voxnelo_*_amd64.deb' -type f -print -quit)"
          test -n "$deb"
          sudo apt-get update -qq
          sudo apt-get install -y "./$deb"
          test "$(dpkg-query -W -f='${Status}' voxnelo)" = 'install ok installed'
          test "$(dpkg-query -W -f='${Status}' fonts-noto-cjk)" = 'install ok installed'
          dpkg -L voxnelo | grep -Eq '^/usr/share/applications/[^/]+\.desktop$'
          echo "Debian candidate installs cleanly with CJK fonts and desktop integration"
      - name: Upload build candidate
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-${{ matrix.target }}-unsigned
          path: release/
          retention-days: 14
          if-no-files-found: error
# Artifacts are unsigned candidates only, not public releases.
# Real-device audio, distribution signature/notarization and F001–F012 review remain required.
