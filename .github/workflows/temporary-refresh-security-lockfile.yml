name: Temporary trusted branch lockfile regeneration

# Temporary workflow for Issue #138 only. Delete this workflow from the PR
# after the lockfile is generated; it must never be merged into main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - package.json
      - .github/workflows/temporary-refresh-security-lockfile.yml

permissions:
  contents: read

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'fix/security-vitest-audit-v01' &&
      github.event.pull_request.user.login == 'kunlong-luo'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Checkout this exact trusted repository branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: fix/security-vitest-audit-v01
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Resolve and regenerate complete lock with pinned pnpm
        run: pnpm install --lockfile-only --ignore-scripts
      - name: Check resolved lockfile is installable
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Update only the lockfile on the trusted feature branch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- pnpm-lock.yaml
          git commit -m "chore(lockfile): resolve compatible patched Vitest v4 dependency graph"
          git push origin HEAD:refs/heads/fix/security-vitest-audit-v01
      - name: Audit entire dependency graph, no ignores
        run: pnpm audit --audit-level high
