name: One-time merged UI branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-ui-refactor-once.yml]
permissions:
  contents: write
jobs:
  prune:
    runs-on: ubuntu-latest
    if: github.repository == 'kunlong-luo/voxnelo'
    steps:
      - name: Verify merged UI branch and delete it
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branch='refactor/shadcn-tailwind-design-system'
          ahead=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.ahead_by')
          test "$ahead" = "0" || { echo "Branch has unmerged commits"; exit 1; }
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
