name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Reject prerelease dependencies
        run: node --experimental-strip-types scripts/check-stable-dependencies.mts
      - name: Install lockfile
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Architecture
        run: pnpm arch
      - name: UI architecture
        run: pnpm ui:check
      - name: Unit tests and coverage
        run: pnpm test:coverage
      - name: Build
        run: pnpm build
      - name: Validate offline ASR worker IPC transport (mock inference only)
        run: node --experimental-strip-types scripts/check-offline-asr-worker.mts
      - name: Check real-model benchmark CLI syntax (no download or native model)
        run: node --experimental-strip-types --check scripts/benchmark-offline-asr.mts
      - name: Check release checksum manifest CLI syntax
        run: node --experimental-strip-types --check scripts/write-candidate-manifest.mts
      - name: Validate static Pages assets
        run: node --experimental-strip-types scripts/check-pages-artifact.mts
      - name: Renderer size budget
        run: pnpm perf:budget
      - name: Ensure CJK fonts for bilingual screenshot checks
        run: |
          if ! fc-match 'Noto Sans CJK SC' | grep -q 'NotoSansCJK'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
      - name: Responsive Chromium screenshots
        run: node --experimental-strip-types scripts/check-responsive-browser.mts
      - name: Install X11 tools for native Electron smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool openbox
      - name: Native Linux Electron window smoke
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node --experimental-strip-types scripts/check-electron-window.mts
      - name: Persist learning across an actual Electron process restart
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node --experimental-strip-types scripts/check-electron-persistence.mts
      - name: Native Electron 125 percent DPI
        run: VOXNELO_DPI_SCALE=1.25 xvfb-run -a -s "-screen 0 2400x1600x24" node --experimental-strip-types scripts/check-electron-window.mts
      - name: Native Electron 150 percent DPI
        run: VOXNELO_DPI_SCALE=1.5 xvfb-run -a -s "-screen 0 2400x1600x24" node --experimental-strip-types scripts/check-electron-window.mts
      - name: Upload Electron desktop evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-electron-evidence
          path: desktop-evidence/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload responsive layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-layout-evidence
          path: browser-layout/
          retention-days: 14
          if-no-files-found: ignore

  desktop-package:
    name: Desktop package integrity (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Build renderer and Electron
        run: pnpm build
      - name: Gate optional native ASR payload on real WAV inference
        run: pnpm asr:verify-real
      - name: Package unsigned native app (unpacked)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --dir --publish never
      - name: Package Linux installers (deb and AppImage)
        if: runner.os == 'Linux'
        run: pnpm exec electron-builder --linux deb AppImage --publish never
      - name: Assert bundle, installers and Voxnelo identity
        run: node --experimental-strip-types scripts/check-desktop-package.mts
      - name: Install actual Linux DEB via apt, verify package and fonts
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          deb="$(find release -maxdepth 1 -name 'voxnelo_*_amd64.deb' -type f -print -quit)"
          test -n "$deb"
          sudo apt-get update -qq
          sudo apt-get install -y "./$deb"
          test "$(dpkg-query -W -f='${Status}' voxnelo)" = 'install ok installed'
          expected_version="$(node -p 'require("./package.json").version')"
          actual_version="$(dpkg-query -W -f='${Version}' voxnelo)"
          test "$actual_version" = "$expected_version"
          dpkg --compare-versions "$actual_version" gt '0.1.1'
          echo "Linux package Version $actual_version upgrades the 0.1.1 release identity"
          test "$(dpkg-query -W -f='${Status}' fonts-noto-cjk)" = 'install ok installed'
          dpkg -L voxnelo | grep -Eq '^/usr/share/applications/[^/]+\.desktop$'
          echo "apt install verified: Voxnelo, CJK fonts, desktop launcher"
      - name: Verify SHA-256 candidate manifest on Linux
        if: runner.os == 'Linux'
        run: node --experimental-strip-types scripts/write-candidate-manifest.mts
      - name: Upload Linux installers for CI review
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: voxnelo-linux-pr-installers
          path: |
            release/*.deb
            release/*.AppImage
            release/SHA256SUMS-*.txt
            release/candidate-manifest-*.json
          retention-days: 7
          if-no-files-found: error
