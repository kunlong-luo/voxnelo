# Temporary trusted-branch only; delete this file before opening the PR.
name: Temporary pnpm stable pin refresh
on:
  push:
    branches: [chore/pnpm-12-22-20261121]
    paths:
      - '.github/workflows/refresh-pnpm-pin-branch.yml'
permissions:
  contents: write
jobs:
  pin:
    if: github.repository == 'kunlong-luo/voxnelo' && github.ref == 'refs/heads/chore/pnpm-12-22-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Update actual pinned pnpm release and reproducible lockfile
        shell: bash
        run: |
          set -euo pipefail
          pnpm self-update 12.22.0
          node -e "const v=require('./package.json').packageManager; if(!/^pnpm@12\\.22\\.0(?:\\+sha512\\.[A-Za-z0-9_-]+)?$/.test(v)) throw Error('Unexpected pnpm pin: '+v);"
          pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
          pnpm --version
          pnpm install --frozen-lockfile --ignore-scripts
      - name: Commit tool-generated packageManager and lockfile
        shell: bash
        run: |
          set -euo pipefail
          git add -- package.json pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(toolchain): pin pnpm 12.22.0 and regenerated lockfile'
            git push origin HEAD:refs/heads/chore/pnpm-12-22-20261121
          fi
