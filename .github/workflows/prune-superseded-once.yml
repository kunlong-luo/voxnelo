# Temporary one-shot cleanup, removed immediately after successful run.
name: One-time superseded branch cleanup
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-superseded-once.yml
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'kunlong-luo/voxnelo'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify exact branch heads and safely delete obsolete refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          branches=(
            "docs/changelog-backfill"
            "feat/github-pages-preview-readiness"
            "fix/card-footer-overlap"
            "fix/pages-publishing-permissions"
          )
          expected_heads=(
            "5f8b4ca2664180ac0bb2f2151cbca66a23f8708c"
            "bd5d5715c41e805a58bd71424285995bcfaf2051"
            "9fef30e611b6012a6c83b58290474b32ec5ba4e0"
            "e4320bf1dc1d4c3412e18d2248e244c89401cedf"
          )
          failures=0
          for idx in "${!branches[@]}"; do
            branch="${branches[$idx]}"
            expected="${expected_heads[$idx]}"
            echo "::group::Check $branch"
            head=$(gh api "repos/$GH_REPO/git/ref/heads/$branch" --jq '.object.sha') || { failures=1; echo "::endgroup::"; continue; }
            if [[ "$head" != "$expected" ]]; then
              echo "::error::Ref changed unexpectedly; skipping $branch"
              failures=1
              echo "::endgroup::"
              continue
            fi
            ahead=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.ahead_by') || { failures=1; echo "::endgroup::"; continue; }
            if [[ "$ahead" != "0" ]]; then
              case "$branch" in
                "docs/changelog-backfill")
                  pr=22
                  expected_files="CHANGELOG.md,docs/12-工程实施与交付边界.md"
                  ;;
                "fix/card-footer-overlap")
                  pr=23
                  expected_files="apps/web/src/PracticeView.tsx,apps/web/src/nordic.css,apps/web/src/styles.css,apps/web/src/u3-polish.css"
                  ;;
                *)
                  echo "::error::Unexpected unmerged commits in $branch; refusing deletion"
                  failures=1
                  echo "::endgroup::"
                  continue
                  ;;
              esac
              state=$(gh api "repos/$GH_REPO/pulls/$pr" --jq '.state') || { failures=1; echo "::endgroup::"; continue; }
              actual_files=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '[.files[].filename] | sort | join(",")') || { failures=1; echo "::endgroup::"; continue; }
              if [[ "$state" != "closed" || "$actual_files" != "$expected_files" ]]; then
                echo "::error::Unmerged branch $branch is not the reviewed, superseded PR; refusing deletion"
                failures=1
                echo "::endgroup::"
                continue
              fi
              echo "PR #$pr is closed/superseded, with exactly the reviewed old files."
            fi
            if gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch" >/dev/null; then
              echo "Deleted obsolete branch: $branch"
            else
              echo "::error::Failed deleting $branch"
              failures=1
            fi
            echo "::endgroup::"
          done
          exit "$failures"
