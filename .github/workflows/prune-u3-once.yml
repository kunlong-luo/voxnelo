name: One-time U3 branch cleanup
on:
  push:
    branches: [main]
    paths: [.github/workflows/prune-u3-once.yml]
permissions:
  contents: write
jobs:
  prune:
    if: github.repository == 'kunlong-luo/voxnelo'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify included and delete the merged U3 topic branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          branch='feat/u3-polish-i18n-tooltips'
          ahead=$(gh api "repos/$GH_REPO/compare/main...$branch" --jq '.ahead_by')
          if [[ "$ahead" != '0' ]]; then
            echo "::error::$branch has unmerged commits; refusing to delete"
            exit 1
          fi
          gh api --method DELETE "repos/$GH_REPO/git/refs/heads/$branch"
          echo "Deleted merged $branch"
