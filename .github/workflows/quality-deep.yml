# Keep expensive visual/native evidence scoped to UI/design changes rather
# than every PR. Manual dispatch remains available for release sign-off.
name: Scoped deep UI and desktop QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/quality-deep.yml'
      - 'apps/web/src/LiveDictationPanel.tsx'
      - 'apps/web/src/PracticeControlPanel.tsx'
      - 'apps/web/src/PracticeCard.tsx'
      - 'apps/web/src/PracticeView.tsx'
      - 'apps/web/src/PracticeSidebarWidgets.tsx'
      - 'apps/web/src/design-system.css'
      - 'scripts/check-responsive-browser.mts'
      - 'scripts/check-electron-window.mts'
      - 'docs/design/V3-DICTATION-FIRST-UX-2026-11-23.md'

concurrency:
  # New revisions of the same UI PR supersede stale screenshot runs.
  group: deep-ui-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  deep-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build application
        run: pnpm build
      - name: Renderer size budget
        run: pnpm perf:budget
      - name: Ensure CJK fonts for bilingual screenshots
        run: |
          if ! fc-match 'Noto Sans CJK SC' | grep -q 'NotoSansCJK'; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq fonts-noto-cjk
          fi
      - name: Responsive Chromium screenshots
        run: node --experimental-strip-types scripts/check-responsive-browser.mts
      - name: Install X11 tools for native Electron smoke
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb xdotool openbox
      - name: Native Linux Electron window smoke
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node --experimental-strip-types scripts/check-electron-window.mts
      - name: Persistence across real Electron restart
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node --experimental-strip-types scripts/check-electron-persistence.mts
      - name: Native Electron 125 percent DPI
        run: VOXNELO_DPI_SCALE=1.25 xvfb-run -a -s "-screen 0 2400x1600x24" node --experimental-strip-types scripts/check-electron-window.mts
      - name: Native Electron 150 percent DPI
        run: VOXNELO_DPI_SCALE=1.5 xvfb-run -a -s "-screen 0 2400x1600x24" node --experimental-strip-types scripts/check-electron-window.mts
      - name: Upload Electron desktop evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-electron-evidence
          path: desktop-evidence/
          retention-days: 14
          if-no-files-found: ignore
      - name: Upload responsive layout evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: browser-layout-evidence
          path: browser-layout/
          retention-days: 14
          if-no-files-found: ignore
