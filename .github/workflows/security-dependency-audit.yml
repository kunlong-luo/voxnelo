name: Supply-chain dependency audit (Moonshine Python and pnpm)

# Strict audit for the full JavaScript dependency tree, including test tools,
# and the actual installed Python runtime. Audits do not verify wheel provenance.
# Dependency changes must update pnpm-lock.yaml (frozen-install CI checks it);
# changing a package.json script alone must not reinstall and scan Moonshine.
on:
  pull_request:
    paths:
      - '.github/workflows/security-dependency-audit.yml'
      - 'scripts/install-moonshine-linux.mts'
      - 'scripts/moonshine-python-constraints.txt'
      - 'apps/desktop/moonshinePythonDependencies.ts'
      - 'scripts/moonshine-install-transaction.mts'
      - 'pnpm-lock.yaml'
      - 'scripts/audit-registry-license-archives.mts'
      - 'scripts/inspect_registry_notices.py'
      - 'scripts/test_inspect_registry_notices.py'
      - 'scripts/inspect_packaged_asar.py'
      - 'scripts/test_inspect_packaged_asar.py'
      - 'scripts/audit_appimage_distro_packages.py'
      - 'scripts/test_audit_appimage_distro_packages.py'
      - 'scripts/lockfile-license-evidence.mts'
      - 'scripts/package-license-evidence.mts'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  python-runtime:
    name: Audit real pinned Moonshine Python dependency tree
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated Python runtime and auditor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/moonshine-runtime"
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: --index-url https://pypi.org/simple \
            --constraint scripts/moonshine-python-constraints.txt \
            'moonshine-voice==0.0.65'
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip freeze --local > "$RUNNER_TEMP/moonshine-locked-versions.txt"
          grep -qi '^moonshine-voice==0.0.65$' "$RUNNER_TEMP/moonshine-locked-versions.txt"
          python3 -m venv "$RUNNER_TEMP/security-auditor"
          "$RUNNER_TEMP/security-auditor/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: 'pip-audit==2.10.1'
      - name: Scan full installed Python dependency versions against published advisories
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/security-auditor/bin/pip-audit" \
            --no-deps --disable-pip \
            --requirement "$RUNNER_TEMP/moonshine-locked-versions.txt" \
            --format json --output "$RUNNER_TEMP/moonshine-audit.json"
      - name: Retain dependency inventory and advisory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moonshine-runtime-dependency-audit
          path: |
            ${{ runner.temp }}/moonshine-locked-versions.txt
            ${{ runner.temp }}/moonshine-audit.json
          if-no-files-found: warn
          retention-days: 14

  javascript-lockfile:
    name: Audit pnpm workspace dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Gate production workspace dependencies on high/critical advisories
        run: pnpm audit --prod --audit-level high
      - name: Gate full dependency tree including development/test tools
        run: pnpm audit --audit-level high
      # Review-only archive proof; this runs on the existing scoped supply-chain
      # workflow, not on every core CI build. A hash match is not legal approval.
      - name: Rebuild source-bound dependency inventories
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test bounded read-only notice inspection
        run: |
          python3 scripts/test_inspect_registry_notices.py
          python3 scripts/test_inspect_packaged_asar.py
          python3 scripts/test_audit_appimage_distro_packages.py
      - name: Assemble Linux unpacked application for copied dependency coverage (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --linux --dir --publish never
      - name: Independently measure exact upstream registry archives and compare notices
        run: pnpm license:audit:registry --compare-notices --packaged-asar release/linux-unpacked/resources/app.asar
      - name: Preserve sanitized public archive hash evidence
        uses: actions/upload-artifact@v7
        with:
          name: registry-archive-integrity-evidence
          path: |
            build/license-inventory/registry-archives.json
            build/license-inventory/registry-notices.json
          if-no-files-found: error
          retention-days: 14

  native-toolset-pilot:
    # Temporary branch-only investigation, remove after decision.
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/v104-native-toolset-pilot-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    name: Native toolset pilot (NOT a Release) (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: appimage
          - os: windows-latest
            target: nsis
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Build unchanged app using locked dependencies
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm asr:verify-real
      - name: Verify original beta archives and list members
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p pilot-evidence
          sudo apt-get update -qq
          sudo apt-get install -y squashfs-tools
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 'https://github.com/electron-userland/electron-builder-binaries/releases/download/appimage%401.0.3/appimage-tools-runtime-20251108.tar.gz' -o "$RUNNER_TEMP/appimage-pilot.tar.gz"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 'https://github.com/electron-userland/electron-builder-binaries/releases/download/nsis%401.2.1/nsis-bundle-3.12.tar.gz' -o "$RUNNER_TEMP/nsis-pilot.tar.gz"
          (cd "$RUNNER_TEMP" && printf '%s\n' '84021a78ee214ae6fd33a2d62a92ba25542dd10bc86bf117a9b2d0bba44e7665  appimage-pilot.tar.gz' '56997fdefe25e7928a1a68b4583d08b240b66cf660234053b20131a74cc082f4  nsis-pilot.tar.gz' | sha256sum -c -)
          (cd "$RUNNER_TEMP" && sha256sum appimage-pilot.tar.gz nsis-pilot.tar.gz) > pilot-evidence/toolset-archives.sha256
          tar -tzf "$RUNNER_TEMP/appimage-pilot.tar.gz" > pilot-evidence/appimage-toolset-members.txt
          tar -tzf "$RUNNER_TEMP/nsis-pilot.tar.gz" > pilot-evidence/nsis-toolset-members.txt
      - name: Build isolated static-runtime AppImage
        if: runner.os == 'Linux'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --linux AppImage --x64 --config.toolsets.appimage=1.0.3 --publish never
      - name: Inspect actual AppImage without executing
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, struct, subprocess
          files = list(pathlib.Path("release").glob("*.AppImage"))
          if len(files) != 1:
              raise SystemExit("Expected exactly one pilot AppImage")
          image = files[0]
          size = image.stat().st_size
          with image.open("rb") as f:
              prefix = f.read(16 * 1024 * 1024)
          offsets = []
          for match in re.finditer(b"hsqs", prefix):
              offset = match.start()
              if offset + 96 > len(prefix):
                  continue
              major, minor = struct.unpack_from("<HH", prefix, offset + 28)
              used = struct.unpack_from("<Q", prefix, offset + 40)[0]
              block = struct.unpack_from("<I", prefix, offset + 12)[0]
              if (major, minor) == (4, 0) and block in (4096,8192,16384,32768,65536,131072,262144,524288,1048576) and 96 <= used <= size-offset:
                  offsets.append(offset)
          if len(offsets) != 1 or prefix[:4] != b"\x7fELF":
              raise SystemExit("Expected unique bounded SquashFS offset")
          offset = offsets[0]
          command = ["unsquashfs", "-o", str(offset)]
          listing = subprocess.check_output(command + ["-ls", str(image)], timeout=90, text=True)
          pathlib.Path("pilot-evidence/appimage-payload-members.txt").write_text(listing)
          names = ["libXss.so.1", "libXtst.so.6", "libappindicator.so.1", "libgconf-2.so.4", "libindicator.so.7", "libnotify.so.4"]
          records = []
          for name in names:
              expected = "squashfs-root/usr/lib/" + name
              matches = [line for line in listing.splitlines() if line == expected or line.startswith(expected + ".")]
              record = {"historicalName": name, "listedMembers": matches}
              if expected in matches:
                  raw = subprocess.check_output(command + ["-cat", str(image), "usr/lib/" + name], timeout=60)
                  record.update(bytes=len(raw), sha256=hashlib.sha256(raw).hexdigest())
              records.append(record)
          with image.open("rb") as f:
              sha = hashlib.file_digest(f, "sha256").hexdigest()
          report = {"schemaVersion":1, "candidateOnly":True, "legalApproval":False, "publicReleaseApproved":False, "toolset":"1.0.3", "filename":image.name, "bytes":size, "sha256":sha, "runtimeSha256":hashlib.sha256(prefix[:offset]).hexdigest(), "squashfsOffset":offset, "historicalLibraryPaths":records}
          pathlib.Path("pilot-evidence/appimage-payload.json").write_text(json.dumps(report, indent=2)+"\n")
          print(json.dumps(report, indent=2))
          PY
      - name: Build isolated NSIS unified toolset
        if: runner.os == 'Windows'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --win nsis --x64 --config.toolsets.nsis=1.2.1 --publish never
      - name: Record NSIS pilot identity
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pilot-evidence | Out-Null
          $files = @(Get-ChildItem release -Filter '*.exe' -File)
          if ($files.Count -ne 1) { throw 'Expected exactly one NSIS pilot installer' }
          $f = $files[0]
          @{schemaVersion=1;candidateOnly=$true;legalApproval=$false;publicReleaseApproved=$false;toolset='1.2.1';filename=$f.Name;bytes=$f.Length;sha256=(Get-FileHash -Algorithm SHA256 $f.FullName).Hash.ToLowerInvariant()} | ConvertTo-Json | Set-Content -Encoding utf8 pilot-evidence/nsis-payload.json
      - name: Preserve isolated pilot evidence (NOT Release)
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-native-toolset-pilot-${{ matrix.target }}-NOT-RELEASE
          path: |
            pilot-evidence/
            release/*.AppImage
            release/*.exe
          retention-days: 14
          if-no-files-found: error
