name: Supply-chain dependency audit (Moonshine Python and pnpm)

# Strict audit for the full JavaScript dependency tree, including test tools,
# and the actual installed Python runtime. Audits do not verify wheel provenance.
# Dependency changes must update pnpm-lock.yaml (frozen-install CI checks it);
# changing a package.json script alone must not reinstall and scan Moonshine.
on:
  pull_request:
    paths:
      - '.github/workflows/security-dependency-audit.yml'
      - 'scripts/install-moonshine-linux.mts'
      - 'scripts/moonshine-python-constraints.txt'
      - 'apps/desktop/moonshinePythonDependencies.ts'
      - 'scripts/moonshine-install-transaction.mts'
      - 'pnpm-lock.yaml'
      - 'scripts/audit-registry-license-archives.mts'
      - 'scripts/inspect_registry_notices.py'
      - 'scripts/test_inspect_registry_notices.py'
      - 'scripts/inspect_packaged_asar.py'
      - 'scripts/test_inspect_packaged_asar.py'
      - 'scripts/audit_appimage_distro_packages.py'
      - 'scripts/test_audit_appimage_distro_packages.py'
      - 'scripts/lockfile-license-evidence.mts'
      - 'scripts/package-license-evidence.mts'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  python-runtime:
    name: Audit real pinned Moonshine Python dependency tree
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated Python runtime and auditor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/moonshine-runtime"
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: --index-url https://pypi.org/simple \
            --constraint scripts/moonshine-python-constraints.txt \
            'moonshine-voice==0.0.65'
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip freeze --local > "$RUNNER_TEMP/moonshine-locked-versions.txt"
          grep -qi '^moonshine-voice==0.0.65$' "$RUNNER_TEMP/moonshine-locked-versions.txt"
          python3 -m venv "$RUNNER_TEMP/security-auditor"
          "$RUNNER_TEMP/security-auditor/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: 'pip-audit==2.10.1'
      - name: Scan full installed Python dependency versions against published advisories
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/security-auditor/bin/pip-audit" \
            --no-deps --disable-pip \
            --requirement "$RUNNER_TEMP/moonshine-locked-versions.txt" \
            --format json --output "$RUNNER_TEMP/moonshine-audit.json"
      - name: Retain dependency inventory and advisory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moonshine-runtime-dependency-audit
          path: |
            ${{ runner.temp }}/moonshine-locked-versions.txt
            ${{ runner.temp }}/moonshine-audit.json
          if-no-files-found: warn
          retention-days: 14

  javascript-lockfile:
    name: Audit pnpm workspace dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Gate production workspace dependencies on high/critical advisories
        run: pnpm audit --prod --audit-level high
      - name: Gate full dependency tree including development/test tools
        run: pnpm audit --audit-level high
      # Review-only archive proof; this runs on the existing scoped supply-chain
      # workflow, not on every core CI build. A hash match is not legal approval.
      - name: Rebuild source-bound dependency inventories
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test bounded read-only notice inspection
        run: |
          python3 scripts/test_inspect_registry_notices.py
          python3 scripts/test_inspect_packaged_asar.py
          python3 scripts/test_audit_appimage_distro_packages.py
      - name: Assemble Linux unpacked application for copied dependency coverage (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --linux --dir --publish never
      - name: Independently measure exact upstream registry archives and compare notices
        run: pnpm license:audit:registry --compare-notices --packaged-asar release/linux-unpacked/resources/app.asar
      - name: Preserve sanitized public archive hash evidence
        uses: actions/upload-artifact@v7
        with:
          name: registry-archive-integrity-evidence
          path: |
            build/license-inventory/registry-archives.json
            build/license-inventory/registry-notices.json
          if-no-files-found: error
          retention-days: 14

  distro-source-pilot:
    # One-off public archive evidence; remove after review, not a release job.
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/v104-distro-source-pilot-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    name: Historical distro bytes and patched libXtst candidate (NOT Release)
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain exact historical public archive filenames without installing
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voxnelo-distro" distro-evidence
          python3 - <<'PY'
          import json, os, pathlib, subprocess, sys
          sys.path.insert(0, "scripts")
          from audit_appimage_distro_packages import PACKAGES
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "voxnelo-distro"
          pool = ["libx/libxss", "libx/libxtst", "liba/libappindicator", "g/gconf", "libi/libindicator", "libn/libnotify"]
          hosts = ["https://old-releases.ubuntu.com/ubuntu/pool/main/", "https://archive.ubuntu.com/ubuntu/pool/main/", "https://old-releases.ubuntu.com/ubuntu/pool/universe/"]
          rows = []
          for spec, subdir in zip(PACKAGES, pool):
              name, version, _, _ = spec
              filename = f"{name}_{version}_amd64.deb"
              row = {"filename":filename,"attempts":[],"downloaded":False}
              for host in hosts:
                  url = host + subdir + "/" + filename
                  target = root / filename
                  result = subprocess.run(["curl","--fail","--silent","--show-error","--location","--proto","=https","--proto-redir","=https","--connect-timeout","8","--max-time","20","--max-filesize","4194304",url,"-o",str(target)],check=False)
                  row["attempts"].append({"url":url,"exit":result.returncode})
                  if result.returncode == 0 and 0 < target.stat().st_size <= 4194304:
                      row["downloaded"] = True
                      break
                  target.unlink(missing_ok=True)
              rows.append(row)
          pathlib.Path("distro-evidence/downloads.json").write_text(json.dumps(rows,indent=2)+"\n")
          PY
          result=0
          python3 scripts/audit_appimage_distro_packages.py "$RUNNER_TEMP/voxnelo-distro" > distro-evidence/legacy-comparison.json || result=$?
          printf '%s\n' "$result" > distro-evidence/legacy-comparison.exit
          cat distro-evidence/legacy-comparison.json
          # A partial evidence report is deliberately preserved, not a gate pass.
          test -s distro-evidence/legacy-comparison.json
      - name: Compare Ubuntu 18.04-era libXtst with static pilot bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voxnelo-pilot-distro"
          target="$RUNNER_TEMP/voxnelo-pilot-distro/libxtst6_1.2.3-1_amd64.deb"
          if curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 30 --max-filesize 4194304 'https://old-releases.ubuntu.com/ubuntu/pool/main/libx/libxtst/libxtst6_1.2.3-1_amd64.deb' -o "$target"; then
            python3 - <<'PY'
          import json, os, pathlib, sys
          sys.path.insert(0,"scripts")
          from audit_appimage_distro_packages import inspect
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"voxnelo-pilot-distro"
          result=inspect(root,("libxtst6","1.2.3-1","libXtst.so.6.1.0","a3343e51790f219fbb3cb48bc1ba267b4727d9e9277e43cdfc081deb14d910b2"))
          result.update(legalApproval=False,distributorSignatureVerified=False)
          pathlib.Path("distro-evidence/static-pilot-libxtst.json").write_text(json.dumps(result,indent=2)+"\n")
          PY
          else
            printf '%s\n' '{"status":"download-failed","legalApproval":false,"distributorSignatureVerified":false}' > distro-evidence/static-pilot-libxtst.json
          fi
          cat distro-evidence/static-pilot-libxtst.json
      - name: Inspect patched Jammy package via APT authenticated indexes
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -o APT::Update::Error-Mode=any
          apt-cache policy libxtst6:amd64 > distro-evidence/jammy-apt-policy.txt
          version="$(apt-cache policy libxtst6:amd64 | awk '/Candidate:/ {print $2}')"
          test -n "$version"
          dpkg --compare-versions "$version" ge '2:1.2.3-1ubuntu0.22.04.1'
          mkdir -p "$RUNNER_TEMP/voxnelo-patched-distro"
          (cd "$RUNNER_TEMP/voxnelo-patched-distro" && apt-get download "libxtst6:amd64=$version")
          apt-cache show "libxtst6:amd64=$version" > distro-evidence/jammy-package-index.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, subprocess, sys
          sys.path.insert(0,"scripts")
          from audit_appimage_distro_packages import inspect, selected_members, dpkg_output
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"voxnelo-patched-distro"
          files=list(root.glob("*.deb"))
          if len(files)!=1 or files[0].stat().st_size>4194304:
              raise SystemExit("Expected one bounded APT package")
          p=files[0]
          raw=p.read_bytes()
          sha=hashlib.sha256(raw).hexdigest()
          index=pathlib.Path("distro-evidence/jammy-package-index.txt").read_text()
          if sha not in re.findall(r"^SHA256: ([a-f0-9]{64})$",index,re.M):
              raise SystemExit("Downloaded archive differs from APT metadata")
          fields={field:dpkg_output(["--field",str(p),field]).decode().strip() for field in ("Package","Version","Architecture","Source")}
          if fields["Package"]!="libxtst6" or fields["Architecture"]!="amd64":
              raise SystemExit("Unexpected APT package identity")
          subprocess.run(["dpkg","--compare-versions",fields["Version"],"ge","2:1.2.3-1ubuntu0.22.04.1"],check=True)
          elf="usr/lib/x86_64-linux-gnu/libXtst.so.6.1.0"
          copyright="usr/share/doc/libxtst6/copyright"
          members=selected_members(dpkg_output(["--fsys-tarfile",str(p)]),{elf,copyright})
          # Retain original text for reviewer, not a production package or license approval.
          pathlib.Path("distro-evidence/jammy-libxtst-copyright.txt").write_bytes(members[copyright])
          report={"schemaVersion":1,"fields":fields,"archiveSha256":sha,"archiveBytes":len(raw),"aptIndexSha256Matched":True,"elfSha256":hashlib.sha256(members[elf]).hexdigest(),"elfBytes":len(members[elf]),"copyrightSha256":hashlib.sha256(members[copyright]).hexdigest(),"legalApproval":False,"candidateOnly":True,"productionReplacement":False}
          pathlib.Path("distro-evidence/jammy-patched-libxtst.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Preserve source-review evidence even if some checks fail
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-distro-source-review-NOT-RELEASE
          path: distro-evidence/
          retention-days: 14
          if-no-files-found: error
