name: Supply-chain dependency audit (Moonshine Python and pnpm)

# Strict audit for the full JavaScript dependency tree, including test tools,
# and the actual installed Python runtime. Audits do not verify wheel provenance.
# Dependency changes must update pnpm-lock.yaml (frozen-install CI checks it);
# changing a package.json script alone must not reinstall and scan Moonshine.
on:
  pull_request:
    paths:
      - '.github/workflows/security-dependency-audit.yml'
      - 'scripts/install-moonshine-linux.mts'
      - 'scripts/moonshine-python-constraints.txt'
      - 'apps/desktop/moonshinePythonDependencies.ts'
      - 'scripts/moonshine-install-transaction.mts'
      - 'pnpm-lock.yaml'
      - 'scripts/audit-registry-license-archives.mts'
      - 'scripts/inspect_registry_notices.py'
      - 'scripts/test_inspect_registry_notices.py'
      - 'scripts/inspect_packaged_asar.py'
      - 'scripts/test_inspect_packaged_asar.py'
      - 'scripts/audit_appimage_distro_packages.py'
      - 'scripts/test_audit_appimage_distro_packages.py'
      - 'scripts/lockfile-license-evidence.mts'
      - 'scripts/package-license-evidence.mts'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  python-runtime:
    name: Audit real pinned Moonshine Python dependency tree
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated Python runtime and auditor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/moonshine-runtime"
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: --index-url https://pypi.org/simple \
            --constraint scripts/moonshine-python-constraints.txt \
            'moonshine-voice==0.0.65'
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip freeze --local > "$RUNNER_TEMP/moonshine-locked-versions.txt"
          grep -qi '^moonshine-voice==0.0.65$' "$RUNNER_TEMP/moonshine-locked-versions.txt"
          python3 -m venv "$RUNNER_TEMP/security-auditor"
          "$RUNNER_TEMP/security-auditor/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: 'pip-audit==2.10.1'
      - name: Scan full installed Python dependency versions against published advisories
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/security-auditor/bin/pip-audit" \
            --no-deps --disable-pip \
            --requirement "$RUNNER_TEMP/moonshine-locked-versions.txt" \
            --format json --output "$RUNNER_TEMP/moonshine-audit.json"
      - name: Retain dependency inventory and advisory evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: moonshine-runtime-dependency-audit
          path: |
            ${{ runner.temp }}/moonshine-locked-versions.txt
            ${{ runner.temp }}/moonshine-audit.json
          if-no-files-found: warn
          retention-days: 14

  javascript-lockfile:
    name: Audit pnpm workspace dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Gate production workspace dependencies on high/critical advisories
        run: pnpm audit --prod --audit-level high
      - name: Gate full dependency tree including development/test tools
        run: pnpm audit --audit-level high
      # Review-only archive proof; this runs on the existing scoped supply-chain
      # workflow, not on every core CI build. A hash match is not legal approval.
      - name: Rebuild source-bound dependency inventories
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test bounded read-only notice inspection
        run: |
          python3 scripts/test_inspect_registry_notices.py
          python3 scripts/test_inspect_packaged_asar.py
          python3 scripts/test_audit_appimage_distro_packages.py
      - name: Assemble Linux unpacked application for copied dependency coverage (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --linux --dir --publish never
      - name: Independently measure exact upstream registry archives and compare notices
        run: pnpm license:audit:registry --compare-notices --packaged-asar release/linux-unpacked/resources/app.asar
      - name: Preserve sanitized public archive hash evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: registry-archive-integrity-evidence
          path: |
            build/license-inventory/registry-archives.json
            build/license-inventory/registry-notices.json
          if-no-files-found: error
          retention-days: 14

