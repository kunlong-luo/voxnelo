name: Supply-chain dependency audit (Moonshine Python and pnpm)

# Strict audit for the full JavaScript dependency tree, including test tools,
# and the actual installed Python runtime. Audits do not verify wheel provenance.
# Dependency changes must update pnpm-lock.yaml (frozen-install CI checks it);
# changing a package.json script alone must not reinstall and scan Moonshine.
on:
  pull_request:
    paths:
      - '.github/workflows/security-dependency-audit.yml'
      - 'scripts/install-moonshine-linux.mts'
      - 'scripts/moonshine-python-constraints.txt'
      - 'apps/desktop/moonshinePythonDependencies.ts'
      - 'scripts/moonshine-install-transaction.mts'
      - 'pnpm-lock.yaml'
      - 'scripts/audit-registry-license-archives.mts'
      - 'scripts/inspect_registry_notices.py'
      - 'scripts/test_inspect_registry_notices.py'
      - 'scripts/inspect_packaged_asar.py'
      - 'scripts/test_inspect_packaged_asar.py'
      - 'scripts/audit_appimage_distro_packages.py'
      - 'scripts/test_audit_appimage_distro_packages.py'
      - 'scripts/lockfile-license-evidence.mts'
      - 'scripts/package-license-evidence.mts'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true


jobs:
  python-runtime:
    name: Audit real pinned Moonshine Python dependency tree
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install isolated Python runtime and auditor
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y python3-venv
          python3 -m venv "$RUNNER_TEMP/moonshine-runtime"
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: --index-url https://pypi.org/simple \
            --constraint scripts/moonshine-python-constraints.txt \
            'moonshine-voice==0.0.65'
          "$RUNNER_TEMP/moonshine-runtime/bin/python" -m pip freeze --local > "$RUNNER_TEMP/moonshine-locked-versions.txt"
          grep -qi '^moonshine-voice==0.0.65$' "$RUNNER_TEMP/moonshine-locked-versions.txt"
          python3 -m venv "$RUNNER_TEMP/security-auditor"
          "$RUNNER_TEMP/security-auditor/bin/python" -m pip install \
            --isolated --no-input --disable-pip-version-check \
            --only-binary=:all: 'pip-audit==2.10.1'
      - name: Scan full installed Python dependency versions against published advisories
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/security-auditor/bin/pip-audit" \
            --no-deps --disable-pip \
            --requirement "$RUNNER_TEMP/moonshine-locked-versions.txt" \
            --format json --output "$RUNNER_TEMP/moonshine-audit.json"
      - name: Retain dependency inventory and advisory evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: moonshine-runtime-dependency-audit
          path: |
            ${{ runner.temp }}/moonshine-locked-versions.txt
            ${{ runner.temp }}/moonshine-audit.json
          if-no-files-found: warn
          retention-days: 14

  javascript-lockfile:
    name: Audit pnpm workspace dependency advisories
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Gate production workspace dependencies on high/critical advisories
        run: pnpm audit --prod --audit-level high
      - name: Gate full dependency tree including development/test tools
        run: pnpm audit --audit-level high
      # Review-only archive proof; this runs on the existing scoped supply-chain
      # workflow, not on every core CI build. A hash match is not legal approval.
      - name: Rebuild source-bound dependency inventories
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Test bounded read-only notice inspection
        run: |
          python3 scripts/test_inspect_registry_notices.py
          python3 scripts/test_inspect_packaged_asar.py
          python3 scripts/test_audit_appimage_distro_packages.py
      - name: Assemble Linux unpacked application for copied dependency coverage (no publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --linux --dir --publish never
      - name: Independently measure exact upstream registry archives and compare notices
        run: pnpm license:audit:registry --compare-notices --packaged-asar release/linux-unpacked/resources/app.asar
      - name: Preserve sanitized public archive hash evidence
        uses: actions/upload-artifact@v7
        with:
          name: registry-archive-integrity-evidence
          path: |
            build/license-inventory/registry-archives.json
            build/license-inventory/registry-notices.json
          if-no-files-found: error
          retention-days: 14

  patched-appimage-pilot:
    # Temporary same-repository review branch only; no production toolset change.
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/v104-distro-source-pilot-20261125' && github.event.pull_request.head.repo.full_name == github.repository
    name: Pinned patched libXtst AppImage pilot (NOT Release)
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Build unchanged application
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm asr:verify-real
      - name: Verify pinned patched package and prepare isolated toolset
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -o APT::Update::Error-Mode=any
          sudo apt-get install -y --no-install-recommends p7zip-full squashfs-tools binutils xvfb xauth libx11-6 libxext6 x11-utils libgtk-3-0 libnss3 libasound2 libgbm1
          mkdir -p "$RUNNER_TEMP/voxnelo-patched-toolset" "$RUNNER_TEMP/voxnelo-patched-deb" patched-evidence
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' --max-time 120 --max-filesize 4194304 'https://github.com/electron-userland/electron-builder-binaries/releases/download/appimage-12.0.1/appimage-12.0.1.7z' -o "$RUNNER_TEMP/voxnelo-legacy-toolset.7z"
          printf '%s  %s\n' 'd12ff7eb8f1d1ec4652ca5237a7fbdca33acc0c758045636feca62dc6ecb8ec4' "$RUNNER_TEMP/voxnelo-legacy-toolset.7z" | sha256sum -c -
          7z x -y "-o$RUNNER_TEMP/voxnelo-patched-toolset" "$RUNNER_TEMP/voxnelo-legacy-toolset.7z"
          version='2:1.2.3-1ubuntu0.22.04.1'
          apt-cache show "libxtst6:amd64=$version" > patched-evidence/apt-package-index.txt
          (cd "$RUNNER_TEMP/voxnelo-patched-deb" && apt-get download "libxtst6:amd64=$version")
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, sys
          sys.path.insert(0,"scripts")
          from audit_appimage_distro_packages import dpkg_output, selected_members
          temp=pathlib.Path(os.environ["RUNNER_TEMP"])
          files=list((temp/"voxnelo-patched-deb").glob("*.deb"))
          if len(files)!=1 or files[0].stat().st_size!=13436:
              raise SystemExit("Expected exact previously measured patched archive")
          p=files[0]
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          if sha!="1cda20d06d364fbe534755cfbe60e387fcecac537e7ab5b8c7a9e83bffd911f8" or sha not in re.findall(r"^SHA256: ([a-f0-9]{64})$",pathlib.Path("patched-evidence/apt-package-index.txt").read_text(),re.M):
              raise SystemExit("Patched archive differs from pinned bytes or APT index")
          fields={k:dpkg_output(["--field",str(p),k]).decode().strip() for k in ("Package","Version","Architecture")}
          if fields!={"Package":"libxtst6","Version":"2:1.2.3-1ubuntu0.22.04.1","Architecture":"amd64"}:
              raise SystemExit("Unexpected package identity")
          elf="usr/lib/x86_64-linux-gnu/libXtst.so.6.1.0"
          notice="usr/share/doc/libxtst6/copyright"
          members=selected_members(dpkg_output(["--fsys-tarfile",str(p)]),{elf,notice})
          digest=lambda b:hashlib.sha256(b).hexdigest()
          if digest(members[elf])!="4198b32dc9fba7dfc0ee2bb1b6bc85067c89adfc68d0279059ad82c207cc3c35" or digest(members[notice])!="304f78731e1e0e78132fbba4e1909c8642878a3b8c4837b36cb2d38891bf2204":
              raise SystemExit("Patched ELF or notice mismatch")
          dest=temp/"voxnelo-patched-toolset/lib/x64/libXtst.so.6"
          if dest.is_symlink() or not dest.is_file() or digest(dest.read_bytes())!="38f9ccb12d2c477aad85db6279afc334d9f250f613884c188ace7232b83e9b68":
              raise SystemExit("Unexpected legacy toolset library")
          (temp/"voxnelo-old-libXtst.so.6").write_bytes(dest.read_bytes())
          dest.write_bytes(members[elf])
          # Ephemeral build input only, not a committed production notice.
          pathlib.Path("build/third-party-notices/Ubuntu-libXtst.txt").write_bytes(members[notice])
          pathlib.Path("patched-evidence/Ubuntu-libXtst.txt").write_bytes(members[notice])
          pathlib.Path("patched-evidence/input.json").write_text(json.dumps({"fields":fields,"archiveSha256":sha,"oldElfSha256":"38f9ccb12d2c477aad85db6279afc334d9f250f613884c188ace7232b83e9b68","patchedElfSha256":digest(members[elf]),"copyrightSha256":digest(members[notice]),"legalApproval":False,"candidateOnly":True},indent=2)+"\n")
          PY
          readelf -d -V "$RUNNER_TEMP/voxnelo-old-libXtst.so.6" > patched-evidence/old-elf-dynamic-versions.txt
          readelf -d -V "$RUNNER_TEMP/voxnelo-patched-toolset/lib/x64/libXtst.so.6" > patched-evidence/patched-elf-dynamic-versions.txt
      - name: Build AppImage with isolated replacement, never publish
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          export APPIMAGE_TOOLS_PATH="$RUNNER_TEMP/voxnelo-patched-toolset"
          pnpm exec electron-builder --linux AppImage --x64 --config.toolsets.appimage=0.0.0 --publish never
      - name: Prove actual final payload has exact replacement and notice bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, pathlib, re, struct, subprocess
          files=list(pathlib.Path("release").glob("*.AppImage"))
          if len(files)!=1:
              raise SystemExit("Expected one pilot AppImage")
          image=files[0]
          size=image.stat().st_size
          with image.open("rb") as f:
              prefix=f.read(16*1024*1024)
          offsets=[]
          for m in re.finditer(b"hsqs",prefix):
              o=m.start()
              if o+96>len(prefix): continue
              version=struct.unpack_from("<HH",prefix,o+28)
              used=struct.unpack_from("<Q",prefix,o+40)[0]
              block=struct.unpack_from("<I",prefix,o+12)[0]
              if version==(4,0) and block in (4096,8192,16384,32768,65536,131072,262144,524288,1048576) and 96<=used<=size-o:
                  offsets.append(o)
          if prefix[:4]!=b"\x7fELF" or len(offsets)!=1:
              raise SystemExit("Invalid AppImage container")
          cmd=["unsquashfs","-o",str(offsets[0])]
          listing=subprocess.check_output(cmd+["-ls",str(image)],timeout=90,text=True)
          pathlib.Path("patched-evidence/payload-members.txt").write_text(listing)
          xtst=[line for line in listing.splitlines() if "libXtst.so" in line]
          if xtst!=["squashfs-root/usr/lib/libXtst.so.6"]:
              raise SystemExit("Unexpected additional/missing Xtst path")
          def member(path):
              return subprocess.check_output(cmd+["-cat",str(image),path],timeout=60)
          digest=lambda b:hashlib.sha256(b).hexdigest()
          actual=digest(member("usr/lib/libXtst.so.6"))
          notice=digest(member("resources/THIRD-PARTY-NOTICES/Ubuntu-libXtst.txt"))
          if actual!="4198b32dc9fba7dfc0ee2bb1b6bc85067c89adfc68d0279059ad82c207cc3c35" or notice!="304f78731e1e0e78132fbba4e1909c8642878a3b8c4837b36cb2d38891bf2204":
              raise SystemExit("Final payload mismatch")
          with image.open("rb") as f:
              hasher=hashlib.sha256()
              for chunk in iter(lambda: f.read(1024*1024), b""):
                  hasher.update(chunk)
              sha=hasher.hexdigest()
          report={"schemaVersion":1,"filename":image.name,"bytes":size,"sha256":sha,"squashfsOffset":offsets[0],"patchedElfSha256":actual,"copyrightSha256":notice,"candidateOnly":True,"legalApproval":False,"publicReleaseApproved":False,"runtimeTested":False}
          pathlib.Path("patched-evidence/payload.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          PY
      - name: Check actual patched library exports and X11 load on Jammy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/voxnelo-patched-runtime"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          report=json.loads(pathlib.Path("patched-evidence/payload.json").read_text())
          image=pathlib.Path("release")/report["filename"]
          library=subprocess.check_output(["unsquashfs","-o",str(report["squashfsOffset"]),"-cat",str(image),"usr/lib/libXtst.so.6"],timeout=60)
          if hashlib.sha256(library).hexdigest()!=report["patchedElfSha256"]:
              raise SystemExit("Extracted runtime probe input mismatch")
          (pathlib.Path(os.environ["RUNNER_TEMP"])/"voxnelo-patched-runtime/libXtst.so.6").write_bytes(library)
          PY
          python3 - <<'PY'
          import json, os, pathlib, subprocess
          root=pathlib.Path(os.environ["RUNNER_TEMP"])
          def exports(path):
              output=subprocess.check_output(["nm","-D","--defined-only","--format=posix",str(path)],text=True,timeout=15)
              return {line.split()[0] for line in output.splitlines() if line.startswith(("XTest","XRecord"))}
          old=exports(root/"voxnelo-old-libXtst.so.6")
          new=exports(root/"voxnelo-patched-runtime/libXtst.so.6")
          report={"oldPublicExports":sorted(old),"patchedPublicExports":sorted(new),"missingPublicExports":sorted(old-new)}
          pathlib.Path("patched-evidence/export-comparison.json").write_text(json.dumps(report,indent=2)+"\n")
          if not old or old-new:
              raise SystemExit("Missing historical XTest/XRecord public exports")
          PY
          xvfb-run -a python3 - <<'PY'
          import ctypes as c, hashlib, json, os, pathlib
          path=pathlib.Path(os.environ["RUNNER_TEMP"])/"voxnelo-patched-runtime/libXtst.so.6"
          x11=c.CDLL("libX11.so.6")
          xtst=c.CDLL(str(path))
          x11.XOpenDisplay.argtypes=[c.c_char_p]
          x11.XOpenDisplay.restype=c.c_void_p
          x11.XCloseDisplay.argtypes=[c.c_void_p]
          x11.XCloseDisplay.restype=c.c_int
          xtst.XTestQueryExtension.argtypes=[c.c_void_p]+[c.POINTER(c.c_int)]*4
          xtst.XTestQueryExtension.restype=c.c_int
          display=x11.XOpenDisplay(None)
          if not display:
              raise SystemExit("Xvfb display unavailable")
          event,error,major,minor=(c.c_int() for _ in range(4))
          try:
              if not xtst.XTestQueryExtension(display,c.byref(event),c.byref(error),c.byref(major),c.byref(minor)):
                  raise SystemExit("XTest extension unavailable")
          finally:
              x11.XCloseDisplay(display)
          report={"schemaVersion":1,"librarySha256":hashlib.sha256(path.read_bytes()).hexdigest(),"xvfbLoadAndQueryPassed":True,"xTestExtensionVersion":[major.value,minor.value],"fullAppLaunchTested":False,"physicalMicTested":False,"legalApproval":False,"publicReleaseApproved":False}
          pathlib.Path("patched-evidence/x11-runtime-probe.json").write_text(json.dumps(report,indent=2)+"\n")
          PY
      - name: Observe actual packaged app startup and mapped patched library (Xvfb)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          report=json.loads(pathlib.Path("patched-evidence/payload.json").read_text())
          image=pathlib.Path("release")/report["filename"]
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"voxnelo-appdir"
          if root.exists():
              raise SystemExit("Expected fresh app directory")
          subprocess.run(["unsquashfs","-o",str(report["squashfsOffset"]),"-d",str(root),str(image)],check=True,timeout=120)
          library=root/"usr/lib/libXtst.so.6"
          if not library.is_file() or library.is_symlink() or hashlib.sha256(library.read_bytes()).hexdigest()!=report["patchedElfSha256"]:
              raise SystemExit("Extracted app directory library mismatch")
          PY
          xvfb-run -a python3 - <<'PY'
          import hashlib, json, os, pathlib, signal, subprocess, tempfile, time
          root=pathlib.Path(os.environ["RUNNER_TEMP"])/"voxnelo-appdir"
          expected=str(root/"usr/lib/libXtst.so.6")
          report={"schemaVersion":1,"fullAppLaunchTested":False,"windowObserved":False,"rendererObserved":False,"patchedLibraryMapped":False,"physicalMicTested":False,"legalApproval":False,"publicReleaseApproved":False,"scope":"Extracted AppDir launcher on Ubuntu 22.04 Xvfb; not FUSE mount or real desktop"}
          with tempfile.TemporaryDirectory(prefix="voxnelo-app-profile-") as private:
              env=dict(os.environ,HOME=private,XDG_CONFIG_HOME=private+"/config",XDG_DATA_HOME=private+"/data",XDG_CACHE_HOME=private+"/cache",APPDIR=str(root),APPIMAGE=str(root/"AppRun"),APPIMAGE_SILENT_INSTALL="1")
              with tempfile.TemporaryFile() as log:
                  proc=subprocess.Popen([str(root/"AppRun")],cwd=str(root),env=env,stdout=log,stderr=subprocess.STDOUT,start_new_session=True)
                  try:
                      for _ in range(60):
                          if proc.poll() is not None:
                              report["launcherExitCode"]=proc.returncode
                              break
                          members=[]
                          for entry in pathlib.Path("/proc").iterdir():
                              if not entry.name.isdigit(): continue
                              try:
                                  if os.getpgid(int(entry.name))!=proc.pid: continue
                                  cmd=(entry/"cmdline").read_bytes()
                                  maps=(entry/"maps").read_text(errors="replace")
                                  members.append((cmd,maps))
                              except (OSError,ProcessLookupError):
                                  continue
                          report["rendererObserved"]|=any(b"--type=renderer" in cmd for cmd,_ in members)
                          report["patchedLibraryMapped"]|=any(any(line.endswith(" "+expected) for line in maps.splitlines()) for _,maps in members)
                          windows=subprocess.run(["xwininfo","-root","-tree"],capture_output=True,text=True,timeout=5)
                          report["windowObserved"]|=windows.returncode==0 and any('"Voxnelo' in line for line in windows.stdout.splitlines())
                          if all(report[k] for k in ("rendererObserved","patchedLibraryMapped","windowObserved")):
                              report["fullAppLaunchTested"]=True
                              break
                          time.sleep(0.5)
                  finally:
                      try: os.killpg(proc.pid,signal.SIGTERM)
                      except ProcessLookupError: pass
                      try: proc.wait(timeout=5)
                      except subprocess.TimeoutExpired:
                          os.killpg(proc.pid,signal.SIGKILL)
                          proc.wait(timeout=5)
                      log.seek(0)
                      # Retain only a bounded diagnostic; fresh synthetic profile, no user data.
                      pathlib.Path("patched-evidence/app-launch-diagnostic.txt").write_bytes(log.read(65536))
          pathlib.Path("patched-evidence/app-launch-probe.json").write_text(json.dumps(report,indent=2)+"\n")
          print(json.dumps(report,indent=2))
          if not report["fullAppLaunchTested"]:
              raise SystemExit("Full extracted AppDir launch evidence incomplete")
          PY
      - name: Preserve isolated proof, even when failed
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-patched-libxtst-pilot-NOT-RELEASE
          path: |
            patched-evidence/
            release/*.AppImage
          retention-days: 14
          if-no-files-found: error
