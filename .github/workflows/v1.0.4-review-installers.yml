name: Build v1.0.4 unsigned installer review artifacts (NOT a Release)

# Read-only, explicitly scoped source-commit review build after this workflow
# changes on main or a maintainer starts workflow_dispatch. No tag, GitHub
# Release, bundled SDK/model, user audio or public announcement.
# Artifacts have limited retention and require maintainer review before the
# separate manual release-draft workflow is invoked.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/v1.0.4-review-installers.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voxnelo-v1.0.4-review-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Require exact v1.0.4 main source
    if: github.repository == 'kunlong-luo/voxnelo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup exact candidate Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Reject stale pinned pnpm/Node toolchains before expensive candidate build
        run: node --experimental-strip-types scripts/check-toolchain-consistency.mts
      - name: Verify version and unpublished notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = '1.0.4'
          test -s docs/release-notes/v1.0.4.md
          grep -q '尚未公开' docs/release-notes/v1.0.4.md
          echo 'Preparing v1.0.4 review-only installers; no tag or Release will be created.'

  native-moonshine:
    name: Require real Moonshine SDK/model on all three supported native platforms
    needs: preflight
    permissions:
      contents: read
    uses: ./.github/workflows/moonshine-native-matrix.yml

  build:
    name: Build review-only unsigned installer (${{ matrix.target }})
    needs: preflight
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux
            args: --linux deb AppImage
          - os: windows-latest
            target: windows
            args: --win nsis
          - os: macos-latest
            target: mac
            args: --mac dmg
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.22.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      # Fail early on the exact local-only Python preflight which exposed a
      # null child exit on Windows review run 45369201513. The full suite
      # remains mandatory on every platform; no acoustic threshold changes.
      - name: Verify local-only Moonshine fixture process on Windows
        if: runner.os == 'Windows'
        run: pnpm exec vitest run tests/moonshine-candidate.test.ts
      # The former latest-main candidate run 45150623898 exposed Windows
      # Git CRLF conversion in exact-blob/README/workflow byte assertions.
      # Keep this fast read-only guard before the entire platform test suite.
      - name: Require unchanged LF bytes in Windows and Unix checkout
        run: pnpm exec vitest run tests/windows-checkout-lf.test.ts tests/first-party-license-packaging.test.ts
      - name: Reject High/Critical dependency advisories (prod and dev)
        run: pnpm audit --prod --audit-level high && pnpm audit --audit-level high
      - name: Typecheck and test
        run: pnpm typecheck && pnpm test
      - name: Build production renderer and Electron
        run: pnpm build
      # Bind the live registry evidence to the same exact source as the
      # review installers. This is not a redistribution/physical QA approval.
      - name: Verify live archive and installed root notice equivalence
        if: runner.os == 'Linux'
        run: pnpm license:audit:registry --compare-notices
      - name: Preserve sanitized review-source dependency notice evidence
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-v1.0.4-review-registry-notice-evidence
          path: |
            build/license-inventory/registry-archives.json
            build/license-inventory/registry-notices.json
          retention-days: 14
          if-no-files-found: error
      - name: Assert no unverified native ASR model is bundled
        run: pnpm asr:verify-real
      - name: Build real OS-native unsigned installer (never publish)
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.args }} --publish never
      - name: Brand Linux AppStream and create identical Discover DEB alias
        if: runner.os == 'Linux'
        run: node --experimental-strip-types scripts/brand-linux-installer.mts
      - name: Inspect the real packaged files, versions and architecture
        env:
          VOXNELO_REQUIRE_INSTALLERS: '1'
        run: node --experimental-strip-types scripts/check-desktop-package.mts
      - name: Test Linux DEB apt installation
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ./release/voxnelo_1.0.4_amd64.deb
          test "$(dpkg-query -W -f='${Version}' voxnelo)" = '1.0.4'
          dpkg -L voxnelo | grep -Fx '/usr/share/metainfo/app.voxnelo.desktop.metainfo.xml'
          node --experimental-strip-types scripts/check-installed-linux-license.mts
      # electron-builder's Windows default is 'Voxnelo Setup 1.0.4.exe' (spaces),
      # not the dotted historical v1.0.3 Release attachment alias.
      - name: Generate review-only per-platform SHA-256 and provenance manifest
        run: node --experimental-strip-types scripts/write-candidate-manifest.mts
      - name: Upload private CI assembly inputs (NOT Release attachments)
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-v1.0.4-${{ matrix.target }}-review-input
          path: |
            release/*.deb
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/SHA256SUMS-*.txt
            release/candidate-manifest-*.json
          retention-days: 14
          if-no-files-found: error

  review-bundle:
    name: Verify and upload combined three-platform review ZIP (no release)
    needs: [preflight, build, native-moonshine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: voxnelo-v1.0.4-*-review-input
          path: review-assets
          merge-multiple: true
      - name: Validate exact version, commit, workflow run, checksums and file inventory
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/validate-release-draft.mts \
            review-assets '1.0.4' "$GITHUB_SHA" "$GITHUB_RUN_ID"
          for platform in linux win32 darwin; do
            (cd review-assets && sha256sum -c "SHA256SUMS-$platform.txt")
          done
      - name: Archive verified user-facing unsigned installers for maintainer review
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-v1.0.4-unsigned-three-platform-REVIEW-NOT-RELEASE
          path: |
            review-assets/*.deb
            review-assets/*.AppImage
            review-assets/*.exe
            review-assets/*.dmg
            review-assets/SHA256SUMS-*.txt
          retention-days: 14
          if-no-files-found: error
