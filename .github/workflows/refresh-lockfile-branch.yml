# Temporary workflow for this trusted feature branch only.
# DO NOT MERGE THIS FILE. It exists solely to run pnpm's real lockfile resolver.
name: Temporary Node/Electron lockfile refresh
on:
  push:
    branches: [chore/refresh-node-electron-20261121]
    paths:
      - '.github/workflows/refresh-lockfile-branch.yml'
permissions:
  contents: write
jobs:
  regenerate:
    if: github.repository == 'kunlong-luo/voxnelo' && github.ref == 'refs/heads/chore/refresh-node-electron-20261121'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26
      - name: Generate lockfile without executing third-party install scripts
        run: pnpm install --lockfile-only --ignore-scripts --no-frozen-lockfile
      - name: Commit pnpm-generated lockfile to this feature branch
        shell: bash
        run: |
          set -euo pipefail
          git add -- pnpm-lock.yaml
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(deps): regenerate pnpm lockfile with pnpm 12'
            git push origin HEAD:refs/heads/chore/refresh-node-electron-20261121
          fi
