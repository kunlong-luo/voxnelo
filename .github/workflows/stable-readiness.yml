name: Validate Stable readiness (NEVER publish)
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact version of existing signed private draft'
        type: string
        required: true
      confirmation:
        description: 'Enter VERIFY_STABLE_READINESS_ONLY'
        type: string
        required: true
permissions:
  contents: read

jobs:
  evidence:
    name: Verify human evidence and exact release hashes
    runs-on: ubuntu-latest
    outputs:
      windows_sha256: ${{ steps.pin.outputs.windows_sha256 }}
      macos_sha256: ${{ steps.pin.outputs.macos_sha256 }}
      windows_certificate_sha1: ${{ steps.pin.outputs.windows_certificate_sha1 }}
      apple_team_id: ${{ steps.pin.outputs.apple_team_id }}
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      CONFIRMATION: ${{ inputs.confirmation }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Require trusted intent, correct source and existing private draft
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'kunlong-luo/voxnelo'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$CONFIRMATION" = 'VERIFY_STABLE_READINESS_ONLY'
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          test "$RELEASE_VERSION" = "$(node -p 'require("./package.json").version')"
          test -f "docs/release/stable-approval/v$RELEASE_VERSION.json" || {
            echo '::error::F001-F012 and external human evidence missing; Stable BLOCKED'
            exit 1
          }
          # GitHub Drafts may not create a real Git tag until publication.
          # Query the authenticated release list (including drafts) instead.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/voxnelo-releases.json"
          node --experimental-strip-types scripts/check-stable-draft.mts \
            "$RUNNER_TEMP/voxnelo-releases.json" \
            "docs/release/stable-approval/v$RELEASE_VERSION.json" \
            "$RELEASE_VERSION"
      - name: Require reviewed source commit in main and validate any existing tag
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          git merge-base --is-ancestor "$RELEASE_COMMIT" "$GITHUB_SHA" || {
            echo '::error::Reviewed draft commit is not in main history'
            exit 1
          }
          if git ls-remote --exit-code --tags origin "refs/tags/v$RELEASE_VERSION" >/dev/null; then
            git fetch origin "refs/tags/v$RELEASE_VERSION:refs/tags/v$RELEASE_VERSION"
            test "$(git rev-list -n 1 "v$RELEASE_VERSION")" = "$RELEASE_COMMIT" || {
              echo '::error::Existing release tag differs from approved draft source'
              exit 1
            }
          fi
      - name: Download all real final signed draft assets
        run: gh release download "v$RELEASE_VERSION" --dir verified-assets
      - name: Fail closed on missing reviewer, license, physical QA or digest
        run: node --experimental-strip-types scripts/check-stable-evidence.mts "docs/release/stable-approval/v$RELEASE_VERSION.json" "$RELEASE_VERSION" "$RELEASE_COMMIT" verified-assets
      - name: Pin approved final installer hashes and publisher identity for native jobs
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const approval=JSON.parse(readFileSync(`docs/release/stable-approval/v${process.env.RELEASE_VERSION}.json`,'utf8'));
          const fields={
            windows_sha256:approval.artifacts.win32[0].sha256,
            macos_sha256:approval.artifacts.darwin[0].sha256,
            windows_certificate_sha1:approval.signingIdentity.windowsCertificateSha1,
            apple_team_id:approval.signingIdentity.appleTeamId,
          };
          for(const [key,val] of Object.entries(fields)){
            if(!/^[A-Za-z0-9]+$/.test(val))throw Error('Unsafe signed-artifact identity field: '+key);
            appendFileSync(process.env.GITHUB_OUTPUT,`${key}=${val}\n`);
          }
          NODE

  windows-signature:
    name: Require trusted Windows Authenticode signature and timestamp
    needs: evidence
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_WINDOWS_SHA256: ${{ needs.evidence.outputs.windows_sha256 }}
      EXPECTED_WINDOWS_CERT_SHA1: ${{ needs.evidence.outputs.windows_certificate_sha1 }}
    steps:
      - name: Download actual final NSIS EXE
        shell: pwsh
        run: gh release download "v$env:RELEASE_VERSION" --repo "$env:GITHUB_REPOSITORY" --dir signed-assets --pattern '*.exe'
      - name: Verify trusted code signing
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem signed-assets -Filter '*.exe' -File)
          if ($files.Count -ne 1) {throw 'Require exactly one signed EXE'}
          $actualHash=(Get-FileHash -LiteralPath $files[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -cne $env:EXPECTED_WINDOWS_SHA256) {
            throw 'Stable blocked: native Windows EXE differs from approved SHA-256'
          }
          $sig=Get-AuthenticodeSignature -LiteralPath $files[0].FullName
          if ($sig.Status -ne 'Valid' -or -not $sig.SignerCertificate) {
            throw 'Stable blocked: Authenticode not trusted'
          }
          if (-not $sig.TimeStamperCertificate) {throw 'Stable blocked: timestamp absent'}
          if ($sig.SignerCertificate.Thumbprint.ToUpperInvariant() -cne $env:EXPECTED_WINDOWS_CERT_SHA1) {
            throw 'Stable blocked: trusted publisher certificate differs from approved signer'
          }
          Write-Host "Validated signer $($sig.SignerCertificate.Thumbprint)"

  macos-notarization:
    name: Require Apple-stapled DMG and signed Gatekeeper-approved app
    needs: evidence
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_VERSION: ${{ inputs.version }}
      EXPECTED_MACOS_SHA256: ${{ needs.evidence.outputs.macos_sha256 }}
      EXPECTED_APPLE_TEAM_ID: ${{ needs.evidence.outputs.apple_team_id }}
    steps:
      - name: Download actual final DMG
        shell: bash
        run: gh release download "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --dir signed-assets --pattern '*.dmg'
      - name: Verify real notarization and identity
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find signed-assets -maxdepth 1 -type f -name '*.dmg' -print -quit)"
          test -n "$dmg"
          test "$(find signed-assets -maxdepth 1 -type f -name '*.dmg' | wc -l)" -eq 1
          printf '%s  %s\n' "$EXPECTED_MACOS_SHA256" "$dmg" | shasum -a 256 --check
          xcrun stapler validate "$dmg"
          mkdir mounted
          hdiutil attach -readonly -nobrowse -mountpoint "$PWD/mounted" "$dmg"
          trap 'hdiutil detach "$PWD/mounted" || true' EXIT
          app="$(find mounted -maxdepth 2 -name '*.app' -type d -print -quit)"
          test -n "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose=2 "$app"
          team_id="$(codesign -dv --verbose=4 "$app" 2>&1 | sed -n 's/^TeamIdentifier=//p')"
          test "$team_id" = "$EXPECTED_APPLE_TEAM_ID" || { echo '::error::Apple signer Team ID differs from approved team'; exit 1; }
          bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")"
          test "$bundle_id" = 'app.voxnelo.desktop' || { echo '::error::Signed app bundle identity mismatch'; exit 1; }

# This read-only workflow does not sign, notarize, publish or approve human reviews.
