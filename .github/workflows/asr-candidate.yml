name: Validate real local ASR candidate

# Engineering-only proof: this workflow NEVER stages binaries for a public
# release or claims that a microphone on Windows/macOS/Linux was tested.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/asr-candidate.yml'
      - 'scripts/benchmark-offline-asr.mts'
      - 'scripts/check-platform-asr-candidate.mts'
      - 'apps/desktop/asrConfig.ts'
      - 'apps/desktop/offlineAsrWorker.ts'
      - 'scripts/prepare-asr-model.mts'
      - 'scripts/stage-asr-pilot.mts'
      - 'scripts/check-electron-packaged-asr.mts'
      - 'scripts/check-platform-asr-candidate.mts'
      - 'scripts/check-asr-staging.mts'
      - 'scripts/check-asr-real-release.mts'

permissions:
  contents: read

jobs:
  linux-real-inference:
    name: Linux real model / native addon / PCM inference
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout pinned project code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install locked application dependencies
        run: pnpm install --frozen-lockfile
      - name: Build actual desktop ASR worker
        run: pnpm build:electron
      - name: Install audio fixture generators
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y espeak-ng sox xvfb openbox
      - name: Fetch SHA-256 pinned English streaming model
        run: pnpm asr:model:prepare --out "$RUNNER_TEMP/voxnelo-english-model"
      - name: Install pinned upstream native addon (CI sandbox only)
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/voxnelo-native" sherpa-onnx-node@1.13.8
          node -e 'const {createRequire}=require("node:module");const r=createRequire(process.cwd()+"/package.json");const root=process.env.RUNNER_TEMP+"/voxnelo-native/node_modules";console.log("installed native package:",r.resolve("sherpa-onnx-node",{paths:[root]}))'
      - name: Generate a non-user English reference WAV
        run: |
          espeak-ng -v en-us -s 120 --stdout "please speak English slowly" |
            sox -t wav - -r 16000 -c 1 -b 16 -e signed-integer "$RUNNER_TEMP/voxnelo-asr-reference.wav"
          soxi "$RUNNER_TEMP/voxnelo-asr-reference.wav"
      - name: Share reproducible, non-user audio reference with other OS jobs
        uses: actions/upload-artifact@v7
        with:
          name: voxnelo-asr-generated-reference-wav
          path: ${{ runner.temp }}/voxnelo-asr-reference.wav
          retention-days: 1
          if-no-files-found: error
      - name: Verify genuine native model transcript, speed and error rate
        env:
          QA_SENTENCE: please speak English slowly
        shell: bash
        run: |
          set -euo pipefail
          ADDON="$(node -p 'require.resolve("sherpa-onnx-node",{paths:[process.env.RUNNER_TEMP+"/voxnelo-native/node_modules"]})')"
          export VOXNELO_ASR_MODEL_DIR="$RUNNER_TEMP/voxnelo-english-model"
          export VOXNELO_ASR_ADDON_PATH="$ADDON"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/voxnelo-native/node_modules/sherpa-onnx-node/lib:${LD_LIBRARY_PATH:-}"
          node --experimental-strip-types scripts/benchmark-offline-asr.mts \
            --wav "$RUNNER_TEMP/voxnelo-asr-reference.wav" --expect "$QA_SENTENCE" |
            tee "$RUNNER_TEMP/voxnelo-asr-inference.json"
      - name: Compare real greedy and beam decoders on the same generated speech (diagnostic)
        shell: bash
        run: |
          set -euo pipefail
          ADDON="$(node -p 'require.resolve("sherpa-onnx-node",{paths:[process.env.RUNNER_TEMP+"/voxnelo-native/node_modules"]})')"
          export VOXNELO_ASR_MODEL_DIR="$RUNNER_TEMP/voxnelo-english-model"
          export VOXNELO_ASR_ADDON_PATH="$ADDON"
          export LD_LIBRARY_PATH="$RUNNER_TEMP/voxnelo-native/node_modules/sherpa-onnx-node/lib:${LD_LIBRARY_PATH:-}"
          for method in greedy_search modified_beam_search; do
            node --experimental-strip-types scripts/benchmark-offline-asr.mts \
              --wav "$RUNNER_TEMP/voxnelo-asr-reference.wav" \
              --expect "please speak English slowly" \
              --decoding-method "$method" --report-only \
              > "$RUNNER_TEMP/voxnelo-asr-ab-$method.json"
            cat "$RUNNER_TEMP/voxnelo-asr-ab-$method.json"
          done
          echo "A/B comparison is informational and uses one synthetic non-user sample; do not infer improved real microphone WER."
      - name: Upload non-personal inference evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-real-asr-evidence
          path: |
            ${{ runner.temp }}/voxnelo-asr-inference.json
            ${{ runner.temp }}/voxnelo-asr-ab-greedy_search.json
            ${{ runner.temp }}/voxnelo-asr-ab-modified_beam_search.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Stage a non-distributable Linux ASR resource candidate
        run: node --experimental-strip-types scripts/stage-asr-pilot.mts
      - name: Verify ASR staging hashes, model and native binary
        run: pnpm asr:check-staging
      - name: Re-run real WAV recognition against relocated staged resources
        shell: bash
        run: |
          set -euo pipefail
          export VOXNELO_ASR_MODEL_DIR="$GITHUB_WORKSPACE/build/offline-asr/model"
          export VOXNELO_ASR_ADDON_PATH="$GITHUB_WORKSPACE/build/offline-asr/native/index.cjs"
          export LD_LIBRARY_PATH="$GITHUB_WORKSPACE/build/offline-asr/native/node_modules/sherpa-onnx-node/lib:${LD_LIBRARY_PATH:-}"
          node --experimental-strip-types scripts/benchmark-offline-asr.mts \
            --wav "$RUNNER_TEMP/voxnelo-asr-reference.wav" \
            --expect "please speak English slowly"
      - name: Build renderer for real-engine packaged candidate
        run: pnpm build:renderer
      - name: Build unsigned Linux installers carrying the real ASR engine
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder --linux deb AppImage --publish never
      - name: Add Linux DEB AppStream branding and Discover-friendly alias
        run: node --experimental-strip-types scripts/brand-linux-installer.mts
      - name: Verify packaged native ASR and model hashes exactly match staging
        run: node --experimental-strip-types scripts/check-desktop-package.mts
      - name: Exercise packaged Electron ASR IPC with actual model and non-user PCM
        run: xvfb-run -a -s "-screen 0 1600x1000x24" node --experimental-strip-types scripts/check-electron-packaged-asr.mts
      - name: Upload text-only bundled Electron ASR test evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: linux-packaged-electron-asr-evidence
          path: desktop-evidence/packaged-asr/report.json
          retention-days: 14
          if-no-files-found: ignore
      # No binary artifact upload: this is a redistribution-unreviewed
      # internal build. Formal release requires written licensing approval,
      # Electron ABI/in-app microphone QA and platform signing.

  platform-native-inference:
    name: ${{ matrix.os }} real offline English inference
    needs: linux-real-inference
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder_args: --win nsis
          - os: macos-latest
            builder_args: --mac dmg
    steps:
      - name: Checkout pinned project code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned source dependencies
        run: pnpm install --frozen-lockfile
      - name: Build genuine desktop worker
        run: pnpm build:electron
      - name: Download shared non-user reference audio
        uses: actions/download-artifact@v8
        with:
          name: voxnelo-asr-generated-reference-wav
          path: ${{ runner.temp }}
      - name: Fetch SHA-256 pinned model
        run: pnpm asr:model:prepare --out "${{ runner.temp }}/voxnelo-english-model"
      - name: Install exact upstream platform addon in temporary space
        run: npm install --no-save --prefix "${{ runner.temp }}/voxnelo-native" sherpa-onnx-node@1.13.8
      - name: Check real recognition output, WER and runtime speed
        run: node --experimental-strip-types scripts/check-platform-asr-candidate.mts
      - name: Stage complete native runtime and pinned model for internal package
        run: node --experimental-strip-types scripts/stage-asr-pilot.mts
      - name: Verify relocated model and native binary hashes
        run: pnpm asr:check-staging
      - name: Require genuine inference from relocated native entry
        run: node --experimental-strip-types scripts/check-platform-asr-candidate.mts --staged
      - name: Build renderer for internally packaged ASR
        run: pnpm build:renderer
      - name: Build unsigned platform installer containing local ASR
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm exec electron-builder ${{ matrix.builder_args }} --publish never
      - name: Verify candidate installer and all copied native/model SHA-256
        env:
          VOXNELO_REQUIRE_INSTALLERS: '1'
        run: node --experimental-strip-types scripts/check-desktop-package.mts
      # Never upload candidate executable assets until their redistribution
      # rights, platform policy and human QA are formally signed off.
      - name: Preserve non-personal per-platform evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.os }}-real-asr-evidence
          path: ${{ runner.temp }}/voxnelo-asr-*-evidence.json
          retention-days: 14
          if-no-files-found: ignore
