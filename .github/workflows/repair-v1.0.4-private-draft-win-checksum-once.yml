name: Repair v1.0.4 PRIVATE draft Windows checksum once (never publish)

# Private draft v1.0.4 does NOT have a published git tag; GitHub's release
# lookup by /releases/tags/v1.0.4 returns 404 even with a valid token.
# Always use the exact authenticated draft Release ID 428750217 instead.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-v1.0.4-private-draft-win-checksum-once.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repair-v1.0.4-private-draft-windows-sha
  cancel-in-progress: false

jobs:
  repair:
    name: Reconcile private draft asset filename and checksum by RELEASE ID
    if: github.repository == 'kunlong-luo/voxnelo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: kunlong-luo/voxnelo
      RELEASE_ID: '428750217'
    steps:
      - name: Require exact private draft, SHA target and all eight original assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/voxnelo-draft.json"
          jq -e '
            .id == 428750217 and
            .tag_name == "v1.0.4" and
            .draft == true and
            .prerelease == true and
            .published_at == null and
            .target_commitish == "4aeb58e37840d2aec760fac3e348ab18b9ce1be1" and
            ([.assets[].name] | sort) ==
            ([
              "SHA256SUMS-darwin.txt", "SHA256SUMS-linux.txt", "SHA256SUMS-win32.txt",
              "Voxnelo-1.0.4-arm64.dmg", "Voxnelo-1.0.4.AppImage", "Voxnelo.deb",
              "Voxnelo.Setup.1.0.4.exe", "voxnelo_1.0.4_amd64.deb"
            ] | sort)
          ' "$RUNNER_TEMP/voxnelo-draft.json"
      - name: Download ACTUAL draft EXE and original checksum by immutable asset IDs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/asset-original"
          exe_id="$(jq -r '.assets[] | select(.name == "Voxnelo.Setup.1.0.4.exe") | .id' "$RUNNER_TEMP/voxnelo-draft.json")"
          checksum_id="$(jq -r '.assets[] | select(.name == "SHA256SUMS-win32.txt") | .id' "$RUNNER_TEMP/voxnelo-draft.json")"
          [[ "$exe_id" =~ ^[0-9]+$ && "$checksum_id" =~ ^[0-9]+$ ]]
          echo "$checksum_id" > "$RUNNER_TEMP/old-win-checksum-id"
          for asset in "$exe_id:Voxnelo.Setup.1.0.4.exe" "$checksum_id:SHA256SUMS-win32.txt"; do
            id="${asset%%:*}"
            filename="${asset#*:}"
            curl --fail --silent --show-error --location \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header 'Accept: application/octet-stream' \
              "https://api.github.com/repos/$GH_REPO/releases/assets/$id" \
              --output "$RUNNER_TEMP/asset-original/$filename"
          done
      - name: Compare real EXE bytes to original SHA-256 and stage repaired filename
        id: reconcile
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/asset-original"
          test -s 'Voxnelo.Setup.1.0.4.exe'
          test -s 'SHA256SUMS-win32.txt'
          actual="$(sha256sum 'Voxnelo.Setup.1.0.4.exe' | cut -d ' ' -f 1)"
          current="$(cat SHA256SUMS-win32.txt)"
          if [[ "$current" == "$actual  Voxnelo.Setup.1.0.4.exe" ]]; then
            echo 'Checksum already fixed; verified against exact downloaded EXE.'
            echo 'repair_needed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          [[ "$current" == "$actual  Voxnelo Setup 1.0.4.exe" ]] || {
            echo '::error::Draft checksum does not match the unchanged installer bytes'
            exit 1
          }
          printf '%s  %s\n' "$actual" 'Voxnelo.Setup.1.0.4.exe' > SHA256SUMS-win32.txt
          sha256sum -c SHA256SUMS-win32.txt
          echo 'repair_needed=true' >> "$GITHUB_OUTPUT"
      - name: Upload corrected checksum as TEMP asset, verify, then replace checksum only
        if: steps.reconcile.outputs.repair_needed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" |
            jq -e '.id == 428750217 and .draft == true and .published_at == null and .target_commitish == "4aeb58e37840d2aec760fac3e348ab18b9ce1be1"'
          temp_name="SHA256SUMS-win32-verified-${GITHUB_RUN_ID}.txt"
          curl --fail --silent --show-error --location \
            --request POST \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'Content-Type: text/plain' \
            --data-binary "@$RUNNER_TEMP/asset-original/SHA256SUMS-win32.txt" \
            "https://uploads.github.com/repos/$GH_REPO/releases/$RELEASE_ID/assets?name=$temp_name" \
            --output "$RUNNER_TEMP/staged-sha.json"
          jq -e --arg name "$temp_name" '.state == "uploaded" and .name == $name and (.id | type == "number")' "$RUNNER_TEMP/staged-sha.json"
          staged_id="$(jq -r '.id' "$RUNNER_TEMP/staged-sha.json")"
          previous_id="$(cat "$RUNNER_TEMP/old-win-checksum-id")"
          # Recheck release remains draft even after the temporary upload.
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" |
            jq -e '.id == 428750217 and .draft == true and .published_at == null'
          gh api --method DELETE "repos/$GH_REPO/releases/assets/$previous_id"
          gh api --method PATCH "repos/$GH_REPO/releases/assets/$staged_id" -f name=SHA256SUMS-win32.txt |
            jq -e '.id > 0 and .name == "SHA256SUMS-win32.txt"'
      - name: Re-download SHA-256 by final asset ID and prove private draft has eight assets
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/$RELEASE_ID" > "$RUNNER_TEMP/final-draft.json"
          jq -e '
            .id == 428750217 and .draft == true and .prerelease == true and
            .published_at == null and
            ([.assets[].name] | sort) ==
            ([
              "SHA256SUMS-darwin.txt", "SHA256SUMS-linux.txt", "SHA256SUMS-win32.txt",
              "Voxnelo-1.0.4-arm64.dmg", "Voxnelo-1.0.4.AppImage", "Voxnelo.deb",
              "Voxnelo.Setup.1.0.4.exe", "voxnelo_1.0.4_amd64.deb"
            ] | sort)
          ' "$RUNNER_TEMP/final-draft.json"
          id="$(jq -r '.assets[] | select(.name == "SHA256SUMS-win32.txt") | .id' "$RUNNER_TEMP/final-draft.json")"
          [[ "$id" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/asset-verify"
          curl --fail --silent --show-error --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/octet-stream' \
            "https://api.github.com/repos/$GH_REPO/releases/assets/$id" \
            --output "$RUNNER_TEMP/asset-verify/SHA256SUMS-win32.txt"
          cmp "$RUNNER_TEMP/asset-original/SHA256SUMS-win32.txt" "$RUNNER_TEMP/asset-verify/SHA256SUMS-win32.txt"
          (cd "$RUNNER_TEMP/asset-original" && sha256sum -c SHA256SUMS-win32.txt)
          echo 'Private v1.0.4 draft checksum now matches its downloaded EXE filename.'
