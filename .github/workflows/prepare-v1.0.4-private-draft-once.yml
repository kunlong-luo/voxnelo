name: Prepare v1.0.4 PRIVATE unsigned draft once (never publish)

# The owner has authorized continuing release preparation without repeated
# manual workflow dispatch. Only adding this exact file on main runs once.
# Separate explicit human approval is still required to publish anything.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-v1.0.4-private-draft-once.yml'

permissions:
  contents: read

concurrency:
  group: prepare-v1.0.4-private-draft-once
  cancel-in-progress: false

jobs:
  prepare-private-draft:
    name: Reuse strict three-platform candidate gate; create DRAFT ONLY
    if: github.repository == 'kunlong-luo/voxnelo' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: ./.github/workflows/release-draft.yml
    with:
      version: '1.0.4'
      confirmation: 'PREPARE_DRAFT_ONLY'
