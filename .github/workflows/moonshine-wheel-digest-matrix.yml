name: Moonshine candidate dependency Wheel digest snapshot (manual / scoped PR)

# Read-only evidence only: no release, no model download, no customer audio and
# no Python native runtime loaded. This is deliberately NOT a routine CI job.
on:
  pull_request:
    paths:
      - '.github/workflows/moonshine-wheel-digest-matrix.yml'
      - 'scripts/audit-moonshine-wheelhouse.py'
      - 'scripts/moonshine-python-constraints.txt'
      - 'tests/test_moonshine_wheelhouse_audit.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: moonshine-wheel-digests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-wheel-digests:
    name: Registry-checked Wheel byte inventory (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-24.04, target: linux-x64-python312}
          - {os: windows-latest, target: windows-x64-python312}
          - {os: macos-15, target: macos-arm64-python312}
    steps:
      - name: Checkout without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install exact candidate Python interpreter
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Reject unsafe manifests (offline tests)
        run: python tests/test_moonshine_wheelhouse_audit.py
      - name: Download exact candidate dependency Wheels and check PyPI SHA-256
        shell: pwsh
        run: |
          $wheelhouse = Join-Path $env:RUNNER_TEMP "moonshine-wheelhouse"
          $report = Join-Path $env:RUNNER_TEMP "moonshine-wheel-digest-${{ matrix.target }}.json"
          New-Item -Path $wheelhouse -ItemType Directory -Force | Out-Null
          python -m pip download --isolated --disable-pip-version-check --no-input --no-cache-dir --only-binary=:all: --index-url https://pypi.org/simple --constraint scripts/moonshine-python-constraints.txt --dest "$wheelhouse" "moonshine-voice==0.0.65"
          if ($LASTEXITCODE -ne 0) { throw "Candidate Wheel download failed" }
          python scripts/audit-moonshine-wheelhouse.py "$wheelhouse" scripts/moonshine-python-constraints.txt "$report"
          if ($LASTEXITCODE -ne 0) { throw "Downloaded dependency Wheel hashes could not be reconciled" }
      - name: Retain checksums only, never any downloaded Wheel bytes
        uses: actions/upload-artifact@v7
        with:
          name: moonshine-wheel-digests-${{ matrix.target }}
          path: ${{ runner.temp }}/moonshine-wheel-digest-${{ matrix.target }}.json
          if-no-files-found: error
          retention-days: 14
