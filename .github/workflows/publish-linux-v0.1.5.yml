name: Publish Voxnelo v0.1.5 Linux Early Access (one-time)

# This workflow is intentionally one-shot. It runs only when this exact
# workflow file first lands on main; subsequent source pushes will not
# republish the same version. Existing release/tag is never overwritten.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-linux-v0.1.5.yml'

permissions:
  contents: read

concurrency:
  group: voxnelo-public-linux-v0.1.5
  cancel-in-progress: false

jobs:
  publish-linux:
    name: Verify, package and publish unsigned Linux Early Access
    if: github.repository == 'kunlong-luo/voxnelo' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - name: Checkout exact merge commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the exact release version and truthful early access notes
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p 'require("./package.json").version')" = '0.1.5'
          test -f docs/release-notes/v0.1.5.md
          grep -q 'Linux' docs/release-notes/v0.1.5.md
          grep -q 'Moonshine' docs/release-notes/v0.1.5.md
          grep -q '未签名' docs/release-notes/v0.1.5.md
          if gh release view v0.1.5 >/dev/null 2>&1; then
            echo '::error::v0.1.5 already exists; refusing overwrite'
            exit 1
          fi
          if git ls-remote --exit-code --tags https://github.com/kunlong-luo/voxnelo.git refs/tags/v0.1.5 >/dev/null 2>&1; then
            echo '::error::v0.1.5 tag already exists; refusing overwrite'
            exit 1
          fi
      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck, lint, unit tests and build
        run: pnpm check
      - name: Require validated staged native ASR when present
        run: pnpm asr:verify-real
      - name: Build Linux DEB and AppImage
        run: pnpm exec electron-builder --linux deb AppImage --publish never
      - name: Add AppStream metadata and Discover-friendly package alias
        run: node --experimental-strip-types scripts/brand-linux-installer.mts
      - name: Validate real installer files, identity and embedded Moonshine scripts
        env:
          VOXNELO_REQUIRE_INSTALLERS: '1'
        run: node --experimental-strip-types scripts/check-desktop-package.mts
      - name: Generate and verify installer checksums
        shell: bash
        run: |
          set -euo pipefail
          node --experimental-strip-types scripts/write-candidate-manifest.mts
          cd release
          sha256sum --check SHA256SUMS-linux.txt
          test -s Voxnelo.deb
          test -s voxnelo_0.1.5_amd64.deb
          test -s Voxnelo-0.1.5.AppImage
          cmp -s Voxnelo.deb voxnelo_0.1.5_amd64.deb
      - name: Install release DEB on clean Linux runner
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ./release/voxnelo_0.1.5_amd64.deb
          test "$(dpkg-query -W -f='${Version}' voxnelo)" = '0.1.5'
          test "$(dpkg-query -W -f='${Status}' fonts-noto-cjk)" = 'install ok installed'
      - name: Keep exact built files for audit even if publication fails
        uses: actions/upload-artifact@v4
        with:
          name: voxnelo-v0.1.5-linux-early-access
          path: |
            release/Voxnelo.deb
            release/voxnelo_0.1.5_amd64.deb
            release/Voxnelo-0.1.5.AppImage
            release/SHA256SUMS-linux.txt
          retention-days: 30
          if-no-files-found: error
      - name: Publish PUBLIC Linux Early Access prerelease
        shell: bash
        run: |
          set -euo pipefail
          # Intentional public prerelease after all prior gates, not a stable
          # multi-OS release. gh creates v0.1.5 tag pointing to this main SHA.
          gh release create v0.1.5 \
            release/Voxnelo.deb \
            release/voxnelo_0.1.5_amd64.deb \
            release/Voxnelo-0.1.5.AppImage \
            release/SHA256SUMS-linux.txt \
            --target "$GITHUB_SHA" \
            --title "Voxnelo v0.1.5 — Linux Early Access" \
            --notes-file docs/release-notes/v0.1.5.md \
            --prerelease
          gh release view v0.1.5 --json isDraft,isPrerelease,tagName --jq '. | select(.isDraft == false and .isPrerelease == true and .tagName == "v0.1.5") | .tagName' | grep -qx v0.1.5
