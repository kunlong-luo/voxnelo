name: Temporary v1.0.1 trusted undici lockfile regeneration

# One-time controlled same-repository branch operation. DELETE from the PR before merging.
on:
  push:
    branches:
      - release/v1.0.1-unsigned-maintenance
    paths:
      - .github/workflows/temp-v101-undici-lock.yml

permissions:
  contents: write

jobs:
  regenerate:
    if: github.repository == 'kunlong-luo/voxnelo' && github.ref == 'refs/heads/release/v1.0.1-unsigned-maintenance'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: release/v1.0.1-unsigned-maintenance
          persist-credentials: true
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - name: Regenerate lockfile under pinned toolchain only
        run: |
          pnpm install --lockfile-only
          git diff -- pnpm-lock.yaml | head -n 140
          pnpm install --frozen-lockfile
          pnpm audit --prod --audit-level high
          pnpm audit --audit-level high
          node --input-type=module <<'NODE'
          import {readFileSync} from 'node:fs';
          const lock=readFileSync('pnpm-lock.yaml','utf8');
          for(const [name,version] of [['undici', '6.29.1'], ['undici','7.30.1']]){
            if(!lock.includes('  '+name+'@'+version+':'))throw Error('Missing patched '+name+'@'+version);
          }
          for(const version of ['6.29.0','7.30.0']){
            if(lock.includes('  undici@'+version+':'))throw Error('Vulnerable undici remains: '+version);
          }
          NODE
      - name: Commit only regenerated dependency lock
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/release/v1.0.1-unsigned-maintenance'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pnpm-lock.yaml
          if git diff --cached --quiet; then
            echo '::error::Expected an updated lockfile'
            exit 1
          fi
          git commit -m 'fix(security): pin patched undici 6.29.1 and 7.30.1'
          git push origin HEAD:release/v1.0.1-unsigned-maintenance
