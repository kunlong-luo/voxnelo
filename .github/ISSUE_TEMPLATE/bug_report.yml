name: "问题报告 / Bug report"
description: 报告 Voxnelo 桌面端的可复现问题
title: "[Bug]: "
body:
  - type: checkboxes
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认不是重复问题。
          required: true
        - label: 我没有在截图和日志中包含个人语音录音、令牌或敏感信息。
          required: true
  - type: textarea
    attributes:
      label: 出现了什么问题？
      description: 请简述问题，不要公开上传包含本人声音的录音文件。
    validations:
      required: true
  - type: textarea
    attributes:
      label: 重现步骤
      placeholder: |
        1. 打开 Voxnelo ...
        2. 选择 ...
        3. 点击 ...
    validations:
      required: true
  - type: textarea
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: dropdown
    attributes:
      label: 操作系统
      options: [Linux, Windows, macOS, "其他 / 不确定"]
    validations:
      required: true
  - type: input
    attributes:
      label: 软件版本 / 系统版本
      placeholder: "Voxnelo 0.1.0 / Ubuntu 24.04 / X11"
  - type: dropdown
    attributes:
      label: 问题涉及的功能
      options: ["录音/麦克风", "系统示范语音", "本地学习记录", "收藏/复习", "桌面窗口与布局", "安装/启动", "其他"]
    validations:
      required: true
  - type: textarea
    attributes:
      label: 补充信息
      description: 可提供已遮盖隐私信息的截图或错误摘要。
